<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Calculator</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: rgba(255,255,255,0.04);
    --text: #e8e8f0;
    --text-secondary: #8888a0;
    --accent: #6c5ce7;
    --accent-glow: rgba(108, 92, 231, 0.4);
    --btn-bg: rgba(255,255,255,0.06);
    --btn-hover: rgba(255,255,255,0.12);
    --btn-active: rgba(255,255,255,0.18);
    --display-bg: rgba(0,0,0,0.3);
    --border: rgba(255,255,255,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --op-btn: #6c5ce7;
    --eq-btn: linear-gradient(135deg, #6c5ce7, #a855f7);
    --radius: 20px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .light {
    --bg: #f0f0f5;
    --surface: rgba(255,255,255,0.7);
    --text: #1a1a2e;
    --text-secondary: #666680;
    --accent: #6c5ce7;
    --accent-glow: rgba(108, 92, 231, 0.25);
    --btn-bg: rgba(0,0,0,0.04);
    --btn-hover: rgba(0,0,0,0.08);
    --btn-active: rgba(0,0,0,0.14);
    --display-bg: rgba(0,0,0,0.04);
    --border: rgba(0,0,0,0.08);
    --shadow: 0 8px 32px rgba(0,0,0,0.12);
    --op-btn: #6c5ce7;
    --eq-btn: linear-gradient(135deg, #6c5ce7, #a855f7);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; transition: background var(--transition);
    user-select: none; -webkit-user-select: none;
  }
  .bg-decor {
    position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.15;
    pointer-events: none; transition: all var(--transition);
  }
  .bg-decor-1 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #6c5ce7, transparent);
    top: -100px; right: -50px; animation: float1 12s ease-in-out infinite;
  }
  .bg-decor-2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, #a855f7, transparent);
    bottom: -80px; left: -40px; animation: float2 14s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-30px,30px) scale(1.1); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.15); } }
  .calculator {
    position: relative; z-index: 1;
    background: var(--surface);
    backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px; width: 380px; max-width: 95vw;
    box-shadow: var(--shadow);
    transition: all var(--transition);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  .title {
    font-size: 13px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--text-secondary); text-transform: uppercase;
  }
  .theme-toggle, .history-toggle {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--btn-bg);
    color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .theme-toggle:hover, .history-toggle:hover { background: var(--btn-hover); }
  .header-actions { display: flex; gap: 8px; }
  .display {
    background: var(--display-bg);
    border-radius: 16px; padding: 20px 16px;
    margin-bottom: 16px; min-height: 100px;
    display: flex; flex-direction: column; justify-content: flex-end;
    align-items: flex-end; overflow: hidden;
    border: 1px solid var(--border);
    transition: all var(--transition);
  }
  .expression {
    font-size: 15px; color: var(--text-secondary);
    min-height: 22px; word-break: break-all; text-align: right;
    transition: color var(--transition);
  }
  .result {
    font-size: 42px; font-weight: 300; color: var(--text);
    letter-spacing: -1px; transition: all var(--transition);
    line-height: 1.1; word-break: break-all; text-align: right;
  }
  .history-panel {
    max-height: 0; overflow: hidden; transition: max-height 0.35s ease, margin 0.35s ease;
    margin-bottom: 0; border-radius: 12px;
    background: var(--display-bg); border: 1px solid transparent;
  }
  .history-panel.open {
    max-height: 200px; margin-bottom: 12px; border-color: var(--border);
  }
  .history-inner {
    max-height: 180px; overflow-y: auto; padding: 8px 12px;
    display: flex; flex-direction: column-reverse; gap: 4px;
  }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    transition: background var(--transition); font-size: 14px;
    color: var(--text-secondary);
  }
  .history-item:hover { background: var(--btn-hover); }
  .history-item .h-expr { color: var(--text-secondary); }
  .history-item .h-result { color: var(--text); font-weight: 500; }
  .history-clear {
    font-size: 11px; color: #ef4444; cursor: pointer; text-align: center;
    padding: 6px; border-radius: 6px; transition: background var(--transition);
  }
  .history-clear:hover { background: rgba(239,68,68,0.1); }
  .buttons {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .btn {
    height: 56px; border-radius: 14px; border: none;
    font-size: 20px; font-weight: 500; cursor: pointer;
    background: var(--btn-bg);
    color: var(--text);
    transition: all var(--transition);
    position: relative; overflow: hidden;
    font-family: inherit;
  }
  .btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  .btn:active { background: var(--btn-active); transform: scale(0.96); }
  .btn.op {
    background: rgba(108, 92, 231, 0.15);
    color: var(--op-btn);
  }
  .btn.op:hover { background: rgba(108, 92, 231, 0.25); }
  .btn.func {
    color: var(--text-secondary); font-size: 17px;
  }
  .btn.equals {
    background: var(--eq-btn); color: #fff; font-weight: 600;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn.equals:hover { box-shadow: 0 6px 28px var(--accent-glow); }
  .btn.equals:active { box-shadow: 0 2px 12px var(--accent-glow); }
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0); animation: ripple 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface); color: var(--text);
    padding: 10px 20px; border-radius: 12px; font-size: 13px;
    border: 1px solid var(--border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @media (max-width: 420px) {
    .calculator { padding: 16px; border-radius: 16px; }
    .btn { height: 50px; border-radius: 12px; font-size: 18px; }
    .result { font-size: 34px; }
    .buttons { gap: 7px; }
  }
</style>
</head>
<body>
<div class="bg-decor bg-decor-1"></div>
<div class="bg-decor bg-decor-2"></div>
<div class="calculator">
  <div class="header">
    <span class="title">Calculator</span>
    <div class="header-actions">
      <button class="history-toggle" id="historyBtn" title="History">⏱</button>
      <button class="theme-toggle" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </div>
  <div class="history-panel" id="historyPanel">
    <div class="history-inner" id="historyList"></div>
    <div class="history-clear" id="historyClear">Clear history</div>
  </div>
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <button class="btn func" data-action="clear">C</button>
    <button class="btn func" data-action="paren">( )</button>
    <button class="btn func" data-action="percent">%</button>
    <button class="btn op" data-action="divide">÷</button>
    <button class="btn" data-action="7">7</button>
    <button class="btn" data-action="8">8</button>
    <button class="btn" data-action="9">9</button>
    <button class="btn op" data-action="multiply">×</button>
    <button class="btn" data-action="4">4</button>
    <button class="btn" data-action="5">5</button>
    <button class="btn" data-action="6">6</button>
    <button class="btn op" data-action="subtract">−</button>
    <button class="btn" data-action="1">1</button>
    <button class="btn" data-action="2">2</button>
    <button class="btn" data-action="3">3</button>
    <button class="btn op" data-action="add">+</button>
    <button class="btn func" data-action="sqrt">√</button>
    <button class="btn" data-action="0">0</button>
    <button class="btn" data-action="decimal">.</button>
    <button class="btn equals" data-action="equals">=</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  class Calculator {
    constructor() {
      this.currentInput = '0';
      this.expression = '';
      this.fullExpression = '';
      this.shouldResetInput = false;
      this.lastResult = null;
      this.history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
      this.openParens = 0;
      this.init();
    }
    init() {
      document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          this.addRipple(e, btn);
          this.handleAction(btn.dataset.action);
        });
        btn.addEventListener('pointerdown', () => {});
      });
      document.addEventListener('keydown', (e) => this.handleKeyboard(e));
      document.getElementById('themeBtn').addEventListener('click', () => this.toggleTheme());
      document.getElementById('historyBtn').addEventListener('click', () => this.toggleHistory());
      document.getElementById('historyClear').addEventListener('click', () => this.clearHistory());
      this.loadTheme();
      this.renderHistory();
      this.updateDisplay();
    }
    addRipple(e, btn) {
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - rect.left - size/2}px`;
      ripple.style.top = `${e.clientY - rect.top - size/2}px`;
      btn.appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    }
    handleAction(action) {
      switch (action) {
        case 'clear': this.clear(); break;
        case 'paren': this.addParen(); break;
        case 'percent': this.percent(); break;
        case 'sqrt': this.sqrt(); break;
        case 'equals': this.calculate(); break;
        case 'add': this.appendOperator('+'); break;
        case 'subtract': this.appendOperator('−'); break;
        case 'multiply': this.appendOperator('×'); break;
        case 'divide': this.appendOperator('÷'); break;
        case 'decimal': this.addDecimal(); break;
        default: this.appendNumber(action); break;
      }
      this.updateDisplay();
    }
    appendNumber(num) {
      if (this.shouldResetInput) {
        this.currentInput = num;
        this.shouldResetInput = false;
      } else {
        this.currentInput = this.currentInput === '0' ? num : this.currentInput + num;
      }
    }
    appendOperator(op) {
      if (this.shouldResetInput && this.lastResult !== null) {
        this.fullExpression = this.lastResult.toString();
        this.shouldResetInput = false;
      }
      this.fullExpression += this.currentInput + op;
      this.expression += this.currentInput + ' ' + op + ' ';
      this.currentInput = '0';
      this.shouldResetInput = false;
    }
    addDecimal() {
      if (this.shouldResetInput) {
        this.currentInput = '0.';
        this.shouldResetInput = false;
        return;
      }
      if (!this.currentInput.includes('.')) {
        this.currentInput += '.';
      }
    }
    addParen() {
      if (this.currentInput !== '0' && !this.shouldResetInput) {
        this.fullExpression += this.currentInput;
        this.expression += this.currentInput;
      }
      if (this.openParens === 0 || this.fullExpression.endsWith('(')) {
        this.fullExpression += '(';
        this.expression += '(';
        this.openParens++;
      } else {
        this.fullExpression += ')';
        this.expression += ')';
        this.openParens--;
      }
      this.currentInput = '0';
      this.shouldResetInput = false;
    }
    percent() {
      const val = parseFloat(this.currentInput);
      if (!isNaN(val)) {
        this.currentInput = (val / 100).toString();
      }
    }
    sqrt() {
      const val = parseFloat(this.currentInput);
      if (!isNaN(val) && val >= 0) {
        this.currentInput = Math.sqrt(val).toString();
        this.addToHistory('√' + val, this.currentInput);
      } else {
        this.showToast('Invalid input');
      }
    }
    calculate() {
      try {
        this.fullExpression += this.currentInput;
        let expr = this.fullExpression
          .replace(/×/g, '*')
          .replace(/÷/g, '/')
          .replace(/−/g, '-');
        // Close any unclosed parens
        for (let i = 0; i < this.openParens; i++) {
          expr += ')';
        }
        const result = Function('"use strict"; return (' + (expr || '0') + ')')();
        const formatted = this.formatResult(result);
        const displayExpr = this.expression + this.currentInput;
        this.addToHistory(displayExpr, formatted);
        this.currentInput = formatted;
        this.expression = '';
        this.fullExpression = '';
        this.openParens = 0;
        this.shouldResetInput = true;
        this.lastResult = result;
      } catch (e) {
        this.showToast('Error');
        this.currentInput = '0';
        this.expression = '';
        this.fullExpression = '';
        this.openParens = 0;
      }
    }
    clear() {
      if (this.currentInput === '0' && this.expression === '') {
        this.clearAll();
      } else {
        this.currentInput = '0';
        this.expression = '';
        this.fullExpression = '';
        this.openParens = 0;
        this.shouldResetInput = false;
      }
    }
    clearAll() {
      this.currentInput = '0';
      this.expression = '';
      this.fullExpression = '';
      this.openParens = 0;
      this.shouldResetInput = false;
      this.lastResult = null;
    }
    formatResult(num) {
      if (!isFinite(num)) return 'Error';
      const str = num.toString();
      if (str.length > 12) {
        return parseFloat(num.toPrecision(10)).toString();
      }
      return str;
    }
    addToHistory(expr, result) {
      this.history.unshift({ expr, result, time: Date.now() });
      if (this.history.length > 50) this.history.pop();
      localStorage.setItem('calcHistory', JSON.stringify(this.history));
      this.renderHistory();
    }
    renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = this.history.map((h, i) =>
        `<div class="history-item" data-index="${i}">
          <span class="h-expr">${this.escapeHtml(h.expr)}</span>
          <span class="h-result">${this.escapeHtml(h.result)}</span>
        </div>`
      ).join('');
      list.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', () => {
          const idx = parseInt(item.dataset.index);
          this.currentInput = this.history[idx].result;
          this.shouldResetInput = true;
          this.updateDisplay();
        });
      });
    }
    clearHistory() {
      this.history = [];
      localStorage.removeItem('calcHistory');
      this.renderHistory();
    }
    toggleHistory() {
      const panel = document.getElementById('historyPanel');
      panel.classList.toggle('open');
    }
    toggleTheme() {
      document.body.classList.toggle('light');
      const isLight = document.body.classList.contains('light');
      document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
      localStorage.setItem('calcTheme', isLight ? 'light' : 'dark');
    }
    loadTheme() {
      if (localStorage.getItem('calcTheme') === 'light') {
        document.body.classList.add('light');
        document.getElementById('themeBtn').textContent = '☀️';
      }
    }
    updateDisplay() {
      document.getElementById('expression').textContent = this.expression;
      const resultEl = document.getElementById('result');
      resultEl.textContent = this.currentInput;
      // Auto-adjust font size for long numbers
      const len = this.currentInput.length;
      if (len > 10) resultEl.style.fontSize = '28px';
      else if (len > 8) resultEl.style.fontSize = '34px';
      else resultEl.style.fontSize = '42px';
    }
    handleKeyboard(e) {
      if (e.key >= '0' && e.key <= '9') this.handleAction(e.key);
      else if (e.key === '.') { e.preventDefault(); this.handleAction('decimal'); }
      else if (e.key === '+') { e.preventDefault(); this.handleAction('add'); }
      else if (e.key === '-') { e.preventDefault(); this.handleAction('subtract'); }
      else if (e.key === '*') { e.preventDefault(); this.handleAction('multiply'); }
      else if (e.key === '/') { e.preventDefault(); this.handleAction('divide'); }
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); this.handleAction('equals'); }
      else if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') this.handleAction('clear');
      else if (e.key === '%') this.handleAction('percent');
      else if (e.key === '(' || e.key === ')') this.handleAction('paren');
      else if (e.key === 'Backspace') {
        e.preventDefault();
        if (this.currentInput.length > 1) {
          this.currentInput = this.currentInput.slice(0, -1);
        } else {
          this.currentInput = '0';
        }
        this.updateDisplay();
      }
    }
    showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
    }
    escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  }
  new Calculator();
</script>
</body>
</html>
