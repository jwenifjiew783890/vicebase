<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vision</title>
<style>
:root{
  --bg:#050a14;  --panel:rgba(10,22,40,.72); --line:rgba(64,160,220,.22);
  --cyan:#3fd0ff; --cyan-dim:#1b7fa8; --gold:#ffc857; --green:#4ade80; --red:#f87171;
  --text:#dbeafe; --muted:#7f9ec4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 50% 38%, #0b2039 0%, #050a14 62%),
    #050a14;
  color:var(--text);font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}
.app{display:grid;grid-template-columns:270px 1fr 300px;height:100vh}
@media(max-width:1100px){.app{grid-template-columns:1fr}.side{display:none}}

/* ---------- panels ---------- */
.side{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(8px)}
.side.right{border-right:none;border-left:1px solid var(--line)}
.side h3{margin:0;padding:13px 15px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--cyan-dim);border-bottom:1px solid var(--line)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:8px}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(63,208,255,.2);border-radius:3px}

/* ---------- centre ---------- */
.centre{display:flex;flex-direction:column;min-height:0;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 18px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em}
.brand{font-weight:700;letter-spacing:.32em;color:var(--cyan)}
.statepill{margin-left:auto;display:flex;align-items:center;gap:7px;
  padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  text-transform:uppercase;font-size:10px;letter-spacing:.14em;cursor:default}
.statepill.listening{border-color:var(--gold);color:var(--gold);cursor:pointer}
.statepill.speaking{border-color:var(--green);color:var(--green);cursor:pointer}
.statepill.thinking{border-color:var(--cyan);color:var(--cyan)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.statepill.listening .dot,.statepill.speaking .dot{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- orb stage ---------- */
.stage{position:relative;height:300px;flex:none;display:grid;place-items:center}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.orb{position:relative;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%, #7ff0ff 0%, #16a6d8 38%, #0a3f66 72%, #05203a 100%);
  box-shadow:0 0 46px rgba(63,208,255,.5),inset 0 0 40px rgba(0,0,0,.55);
  cursor:pointer;transition:transform .25s, box-shadow .25s}
.orb:hover{transform:scale(1.04)}
.orb.listening{box-shadow:0 0 62px rgba(255,200,87,.6),inset 0 0 40px rgba(0,0,0,.5);
  background:radial-gradient(circle at 50% 45%,#ffe9ad 0%,#f0b429 40%,#6b4708 100%)}
.orb.speaking{box-shadow:0 0 62px rgba(74,222,128,.55),inset 0 0 40px rgba(0,0,0,.5);
  background:radial-gradient(circle at 50% 45%,#c7ffd9 0%,#34d399 40%,#064e3b 100%)}
.orb.thinking{animation:spin 2.4s linear infinite}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.orb .ring{position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(63,208,255,.35);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.13);opacity:.15}}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;
  font-size:10px;color:var(--muted);letter-spacing:.06em;pointer-events:none;white-space:nowrap}
.node b{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto 5px;
  background:#0e2a44;border:1.5px solid var(--cyan-dim)}
.node.active b{background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.node.active{color:var(--cyan)}
.node.busy b{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px var(--gold)}

/* ---------- conversation ---------- */
.convo{flex:1;min-height:0;overflow-y:auto;padding:14px 20px 6px}
.convo::-webkit-scrollbar{width:7px}
.convo::-webkit-scrollbar-thumb{background:rgba(63,208,255,.18);border-radius:4px}
.msg{margin:0 0 14px;max-width:min(760px,92%)}
.msg .who{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan-dim);margin-bottom:4px}
.msg.me{margin-left:auto;text-align:right}
.msg.me .who{color:var(--muted)}
.bubble{display:inline-block;padding:9px 13px;border-radius:12px;
  background:rgba(15,32,54,.85);border:1px solid var(--line);white-space:pre-wrap;
  text-align:left;word-break:break-word}
.msg.me .bubble{background:rgba(24,52,84,.85)}
.bubble code,.bubble pre{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.bubble pre{overflow-x:auto;background:#04101f;padding:9px;border-radius:7px;margin:7px 0}
.meta{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
.meta .tag{border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:5px}
.meta .ok{color:var(--green);border-color:rgba(74,222,128,.4)}
.meta .bad{color:var(--red);border-color:rgba(248,113,113,.4)}

/* ---------- composer ---------- */
.composer{display:flex;gap:9px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;background:rgba(8,20,36,.9);border:1px solid var(--line);
  color:var(--text);border-radius:10px;padding:11px 14px;font-size:14px;outline:none}
.composer input:focus{border-color:var(--cyan-dim)}
button{background:rgba(16,40,66,.9);color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px 15px;cursor:pointer;font-size:13px}
button:hover:not(:disabled){border-color:var(--cyan-dim);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button.mic.on{border-color:var(--gold);color:var(--gold)}

/* ---------- list items ---------- */
.item{padding:8px 10px;border-radius:8px;border:1px solid transparent;margin-bottom:5px}
.item:hover{border-color:var(--line);background:rgba(12,28,48,.6)}
.item .t{font-size:12px}
.item .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.badge{float:right;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--green);border-color:rgba(74,222,128,.4)}
.badge.bad{color:var(--red);border-color:rgba(248,113,113,.4)}
.badge.run{color:var(--gold);border-color:rgba(255,200,87,.4)}
.tabs{display:flex;gap:4px;padding:8px 10px 0}
.tabs{flex-wrap:wrap}
.tabs button{flex:1 1 30%;padding:5px 4px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.tabs button.sel{border-color:var(--cyan-dim);color:var(--cyan)}
.empty{color:var(--muted);font-size:11.5px;padding:12px;text-align:center}
.kv{display:flex;justify-content:space-between;font-size:11px;padding:3px 10px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <h3>Activity</h3>
    <div class="scroll" id="activity"><div class="empty">Nothing yet.</div></div>
  </aside>

  <main class="centre">
    <div class="topbar">
      <span class="brand">VISION</span>
      <span id="sub" style="color:var(--muted);font-size:10.5px"></span>
      <span class="statepill" id="pill" title="Click to interrupt while speaking">
        <span class="dot"></span><span id="pilltext">idle</span>
      </span>
    </div>

    <div class="stage">
      <svg id="wires"></svg>
      <div class="orb" id="orb" title="Click to talk"><div class="ring"></div></div>
      <div id="nodes"></div>
    </div>

    <div class="convo" id="convo"></div>

    <div class="composer">
      <button class="mic" id="mic" title="Hold to talk">🎙 Talk</button>
      <input id="input" placeholder="Talk to Vision…  (English, हिन्दी, or Hinglish)" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </main>

  <aside class="side right">
    <div class="tabs">
      <button data-tab="agents" class="sel">Agents</button>
      <button data-tab="jobs">Tasks</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="plugins">Plugins</button>
      <button data-tab="system">System</button>
    </div>
    <div class="scroll" id="rightpane"></div>
  </aside>
</div>

<script>
const $ = s => document.querySelector(s);
const convo = $('#convo'), pill = $('#pill'), pillText = $('#pilltext'), orb = $('#orb');
let ws, session = null, status = null, speaking = null, recorder = null, chunks = [];
let busyAgent = null;

/* ---------- state ---------- */
function setState(s, label){
  pill.className = 'statepill ' + (s==='idle'?'':s);
  pillText.textContent = label || s;
  orb.className = 'orb ' + (s==='idle'?'':s);
}
setState('idle','connecting');

/* ---------- agent ring ---------- */
let RING = ['research','web','browser','knowledge','memory','files','coding','crew'];
function drawRing(){
  const nodes = $('#nodes'), svg = $('#wires');
  const stage = document.querySelector('.stage');
  const W = stage.clientWidth, H = stage.clientHeight;
  const cx = W/2, cy = H/2, rx = Math.min(W*0.34, 330), ry = Math.min(H*0.36, 118);
  nodes.innerHTML = ''; svg.innerHTML = '';
  RING.forEach((name, i) => {
    const a = (-Math.PI/2) + (i * 2*Math.PI/RING.length);
    const x = cx + rx*Math.cos(a), y = cy + ry*Math.sin(a);
    const el = document.createElement('div');
    el.className = 'node' + (busyAgent===name ? ' busy' : '');
    el.id = 'node-'+name;
    el.style.left = x+'px'; el.style.top = y+'px';
    el.innerHTML = '<b></b>'+name;
    nodes.appendChild(el);
    svg.innerHTML += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"
      stroke="${busyAgent===name?'rgba(255,200,87,.55)':'rgba(63,208,255,.16)'}" stroke-width="1"/>`;
  });
}
addEventListener('resize', drawRing);

/* ---------- conversation ---------- */
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(s){
  return esc(s).replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre>${c}</pre>`)
               .replace(/`([^`]+)`/g,'<code>$1</code>')
               .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
}
function bubble(who, text, cls, meta){
  const d = document.createElement('div');
  d.className = 'msg ' + (cls||'');
  d.innerHTML = `<div class="who">${who}</div><div class="bubble">${fmt(text)}</div>` +
                (meta ? `<div class="meta">${meta}</div>` : '');
  convo.appendChild(d); convo.scrollTop = convo.scrollHeight;
  return d;
}

/* ---------- websocket ---------- */
function connect(){
  ws = new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onopen = () => setState('idle','ready');
  ws.onclose = () => { setState('idle','disconnected'); setTimeout(connect, 1500); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}
function handle(m){
  if(m.type==='hello'){ session = m.session; status = m.status; renderRight(); renderSub(); drawRing(); }
  else if(m.type==='thinking'){ setState('thinking','thinking'); }
  else if(m.type==='agent_start'){
    busyAgent = m.agent; drawRing();
    addActivity(`${m.agent} started`, m.task, 'run');
    setState('thinking', m.agent);
  }
  else if(m.type==='agent_progress'){ addActivity(m.message, '', m.ok===false?'bad':'ok'); }
  else if(m.type==='job_started'){
    addActivity(`job ${m.job.id} started`, `${m.job.agent}: ${m.job.request.slice(0,60)}`, 'run');
    if(tab==='jobs') renderRight();
    if(!window._jobPoll) window._jobPoll = setInterval(()=>{ if(tab==='jobs') renderRight(); }, 4000);
  }
  else if(m.type==='reply'){
    busyAgent = null; drawRing();
    let meta = [];
    if(m.agent){
      const r = m.agent_result || {};
      meta.push(`<span class="tag ${r.ok?'ok':'bad'}">${m.agent} ${r.ok?'ok':'failed'}</span>`);
      meta.push(`<span class="tag">${(r.steps||[]).length} steps</span>`);
    } else {
      meta.push(`<span class="tag">${m.route}</span>`);
      if(m.lang) meta.push(`<span class="tag">${m.lang}</span>`);
      if(m.evidence) meta.push(`<span class="tag">evidence ${m.evidence}</span>`);
      if(m.guard) meta.push(`<span class="tag bad">guard: ${m.guard}</span>`);
    }
    meta.push(`<span class="tag">${Math.round(m.ms)}ms</span>`);
    bubble('Vision', m.text, '', meta.join(''));
    (m.learned||[]).forEach(l => addActivity('learned', l.join(' = '), 'ok'));
    speak(m.text, m.lang);
    refreshActivity();
  }
  else if(m.type==='error'){ bubble('Vision','⚠ '+m.error,'', ''); setState('idle','error'); }
}

/* ---------- activity ---------- */
function addActivity(title, sub, kind){
  const box = $('#activity');
  if(box.querySelector('.empty')) box.innerHTML = '';
  const d = document.createElement('div');
  d.className='item';
  d.innerHTML = `<span class="badge ${kind||''}">${kind||''}</span>
    <div class="t">${esc(title)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}`;
  box.prepend(d);
  while(box.children.length > 60) box.lastChild.remove();
}
async function refreshActivity(){
  try{ const t = await (await fetch('/api/tasks')).json();
    if(!t.length) return;
  }catch(e){}
}

/* ---------- send ---------- */
function send(text){
  if(!text.trim() || !ws || ws.readyState!==1) return;
  bubble('You', text, 'me');
  ws.send(JSON.stringify({type:'say', text, session}));
  $('#input').value='';
}
$('#send').onclick = () => send($('#input').value);
$('#input').addEventListener('keydown', e => { if(e.key==='Enter') send($('#input').value); });

/* ---------- speech out ---------- */
async function speak(text, lang){
  if(!text) return;
  stopSpeaking();
  try{
    setState('speaking','speaking — tap to stop');
    const a = new Audio(`/api/tts?text=${encodeURIComponent(text.slice(0,1200))}&lang=${lang||'en'}`);
    speaking = a;
    a.onended = () => { speaking=null; setState('idle','ready'); };
    a.onerror = () => { speaking=null; setState('idle','ready'); };
    await a.play();
  }catch(e){ speaking=null; setState('idle','ready'); }
}
function stopSpeaking(){
  if(speaking){ speaking.pause(); speaking.currentTime=0; speaking=null; }
}
pill.onclick = () => { if(speaking){ stopSpeaking(); setState('idle','stopped'); addActivity('interrupted','you stopped Vision speaking','run'); } };

/* ---------- speech in (browser mic -> server whisper) ---------- */
async function startRec(){
  stopSpeaking();                       // barge-in: talking over Vision stops it
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t=>t.stop());
      setState('thinking','transcribing');
      const fd = new FormData();
      fd.append('audio', new Blob(chunks, {type:recorder.mimeType||'audio/webm'}), 'in.webm');
      try{
        const r = await fetch('/api/stt', {method:'POST', body:fd});
        const j = await r.json();
        if(j.error){ addActivity('STT failed', j.error, 'bad'); setState('idle','ready'); return; }
        addActivity('heard you', `${j.language} · ${j.realtime_factor}x realtime`, 'ok');
        if(j.text) send(j.text); else { setState('idle','ready'); addActivity('heard nothing','',''); }
      }catch(e){ addActivity('STT error', String(e), 'bad'); setState('idle','ready'); }
    };
    recorder.start();
    setState('listening','listening — release to send');
    $('#mic').classList.add('on');
  }catch(e){
    addActivity('microphone blocked', String(e.message||e), 'bad');
    setState('idle','no mic');
  }
}
function stopRec(){
  $('#mic').classList.remove('on');
  if(recorder && recorder.state!=='inactive') recorder.stop();
  recorder = null;
}
const mic = $('#mic');
mic.addEventListener('mousedown', startRec);
mic.addEventListener('touchstart', e=>{e.preventDefault();startRec();});
addEventListener('mouseup', ()=>{ if(recorder) stopRec(); });
addEventListener('touchend', ()=>{ if(recorder) stopRec(); });
orb.onclick = () => { if(speaking){ stopSpeaking(); setState('idle','stopped'); } else if(!recorder){ startRec(); setTimeout(()=>{ if(recorder) stopRec(); }, 6000); } };

/* ---------- right pane ---------- */
let tab = 'agents';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); tab = b.dataset.tab; renderRight();
});
async function renderRight(){
  const p = $('#rightpane');
  if(tab==='agents'){
    const ag = (status?.agents)||[];
    p.innerHTML = ag.map(a=>`<div class="item">
      <span class="badge ${a.dangerous?'bad':''}">${a.dangerous?'gated':'safe'}</span>
      <div class="t">${a.name}</div><div class="s">${esc(a.description)}</div>
      <div class="s" style="opacity:.6">${esc((a.capabilities||[]).join(' · '))}</div></div>`).join('')
      || '<div class="empty">No agents.</div>';
  } else if(tab==='jobs'){
    try{
      const js = await (await fetch('/api/jobs')).json();
      p.innerHTML = js.length ? js.map(j=>`<div class="item">
        <span class="badge ${j.status==='done'?'ok':j.status==='running'?'run':j.status==='queued'?'run':'bad'}">${j.status}</span>
        <div class="t">${esc(j.agent||'')} · ${esc((j.request||'').slice(0,52))}</div>
        <div class="s">${esc((j.progress||'').slice(0,90))}</div>
        <div class="s" style="opacity:.7">${Math.round(j.age_s)}s ago · ${(j.log||[]).length} log lines
          ${(j.status==='running'||j.status==='queued')?`· <a href="#" onclick="cancelJob('${j.id}');return false" style="color:var(--red)">cancel</a>`:''}
        </div></div>`).join('') : '<div class="empty">No tasks yet.</div>';
    }catch(e){ p.innerHTML='<div class="empty">Tasks unavailable.</div>'; }
  } else if(tab==='plugins'){
    try{
      const m = await (await fetch('/api/mcp')).json();
      p.innerHTML =
        `<div style="padding:10px">
           <input id="mcpname" placeholder="name (e.g. filesystem)" style="width:100%;margin-bottom:5px;background:rgba(8,20,36,.9);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px">
           <input id="mcpcmd" placeholder="npx -y @modelcontextprotocol/server-filesystem /path" style="width:100%;background:rgba(8,20,36,.9);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px">
           <button style="margin-top:7px;width:100%" onclick="connectMcp()">Connect MCP server</button>
         </div>` +
        (m.servers.length ? m.servers.map(sv=>`<div class="item">
            <span class="badge ${sv.running?'ok':'bad'}">${sv.running?'connected':'down'}</span>
            <div class="t">${esc(sv.name)}</div>
            <div class="s">${sv.tools.length} tools${sv.error?' · '+esc(sv.error.slice(0,60)):''}</div>
            <div class="s" style="opacity:.7">${esc(sv.tools.slice(0,6).map(t=>t.name).join(', '))}</div>
            <div class="s"><a href="#" onclick="disconnectMcp('${esc(sv.name)}');return false" style="color:var(--red)">disconnect</a></div>
          </div>`).join('') : '<div class="empty">No plugins connected.</div>');
    }catch(e){ p.innerHTML='<div class="empty">Plugins unavailable.</div>'; }
  } else if(tab==='memory'){
    try{
      const m = await (await fetch('/api/memory')).json();
      p.innerHTML =
        `<h3 style="border:none">Facts</h3>` +
        (m.facts.length? m.facts.map(f=>`<div class="item"><div class="t">${esc(f.predicate)}: ${esc(f.object)}</div><div class="s">${esc(f.subject)}</div></div>`).join('') : '<div class="empty">Nothing remembered yet.</div>') +
        `<h3 style="border:none">Notes</h3>` +
        (m.notes.length? m.notes.map(n=>`<div class="item"><div class="t">${esc(n.summary)}</div></div>`).join('') : '<div class="empty">No notes.</div>') +
        `<h3 style="border:none">Rules</h3>` +
        (m.rules.length? m.rules.map(r=>`<div class="item"><div class="s">${esc(r.text)}</div></div>`).join('') : '');
    }catch(e){ p.innerHTML='<div class="empty">Memory unavailable.</div>'; }
  } else {
    try{
      const s = await (await fetch('/api/status')).json();
      const v=s.vision, row=(k,val)=>`<div class="kv"><span>${k}</span><b>${val}</b></div>`;
      p.innerHTML =
        `<h3 style="border:none">Model</h3>`+
        row('loaded', v.llm.loaded?'yes':'no') + (v.llm.error?row('error', esc(v.llm.error)):'') +
        `<h3 style="border:none">Speech</h3>`+
        row('stt', s.stt.available? s.stt.model : 'unavailable') +
        row('tts', s.tts.available? s.tts.installed.length+' voices' : 'unavailable') +
        `<h3 style="border:none">Memory</h3>`+
        row('facts', v.memory.facts) + row('turns', v.memory.turns) + row('rules', v.memory.rules) +
        `<h3 style="border:none">Knowledge</h3>`+
        row('vault', v.vault.path || 'not connected') + row('notes', v.vault.notes) +
        `<div style="padding:10px"><input id="vaultpath" placeholder="/path/to/obsidian/vault"
           style="width:100%;background:rgba(8,20,36,.9);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px">
         <button style="margin-top:7px;width:100%" onclick="connectVault()">Connect vault</button></div>`;
    }catch(e){ p.innerHTML='<div class="empty">Status unavailable.</div>'; }
  }
}
async function cancelJob(id){
  await fetch(`/api/jobs/${id}/cancel`, {method:'POST'});
  addActivity('cancel requested', id, 'run'); renderRight();
}
async function connectMcp(){
  const name = $('#mcpname').value.trim(), cmd = $('#mcpcmd').value.trim();
  if(!name || !cmd) return;
  addActivity('connecting plugin', name, 'run');
  const fd = new FormData(); fd.append('name', name); fd.append('command', cmd);
  const r = await (await fetch('/api/mcp/connect', {method:'POST', body:fd})).json();
  addActivity(r.ok?'plugin connected':'plugin failed',
              r.ok?`${name}: ${r.server.tools.length} tools`:(r.server?.error||r.error||''),
              r.ok?'ok':'bad');
  renderRight();
}
async function disconnectMcp(name){
  const fd = new FormData(); fd.append('name', name);
  await fetch('/api/mcp/disconnect', {method:'POST', body:fd});
  addActivity('plugin disconnected', name, ''); renderRight();
}
async function connectVault(){
  const path = $('#vaultpath').value.trim(); if(!path) return;
  const fd = new FormData(); fd.append('path', path);
  const r = await (await fetch('/api/vault',{method:'POST',body:fd})).json();
  addActivity(r.ok?'vault connected':'vault failed', r.ok?`${r.notes} notes, ${r.chunks} chunks`:r.error, r.ok?'ok':'bad');
  if(r.ok){ status = (await (await fetch('/api/status')).json()).vision; renderRight(); }
}
function renderSub(){
  const v = status; if(!v) return;
  $('#sub').textContent = (v.llm.loaded? 'model ready' : 'no model') +
    ' · ' + v.memory.facts + ' facts' + (v.vault.notes? ' · '+v.vault.notes+' notes':'');
}
connect(); drawRing();
</script>
